# pengaturan ruff di file sendiri, pyproject.toml tanpa [project] membuat Vercel mengabaikan requirements.txt
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[lint]
select = ["E", "F", "I", "B", "UP", "C4"]
ignore = ["B008"]  # Depends() memang dipanggil di default argument

[lint.isort]
lines-after-imports = 1

[lint.per-file-ignores]
# assert di test dibiarkan satu baris supaya mudah dibaca
"tests/*" = ["E501"]
# satu baris data seeder dibiarkan satu baris seperti tabel
"app/seeders/*_seeder.py" = ["E501"]
